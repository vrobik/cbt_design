seoTitlu: "Comunitatea Basarabenilor din Timișoara — Acasă, la 700 km de casă"
seoDescriere: "CBT adună basarabenii stabiliți în Timișoara: evenimente, sprijin pentru nou-veniți și prietenii care țin. Înscrie-te în comunitate."
heroTitlu: "Acasă, la 700 km de casă."
heroText: "Comunitatea Basarabenilor din Timișoara adună oamenii veniți din Republica Moldova — pentru evenimente, sprijin și prietenii care țin."
beneficiiEticheta: "De ce CBT"
beneficiiTitlu: "Ce primești ca membru"
beneficiiText: "Spațiu pregătit pentru beneficiile pe care CBT le va defini — pagina nu va trebui reconstruită."
