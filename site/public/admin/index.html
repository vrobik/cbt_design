<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Administrare conținut · CBT</title>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <!--
      Sveltia CMS — panoul de editare pentru articole, evenimente etc.
      Configurația (ce se poate edita) este în admin/config.yml.
      Versiunea e fixată (0.221.x primește doar corecturi). Pentru actualizare, schimbă numărul de mai jos.
    -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/@sveltia/cms@0.221/dist/sveltia-cms.js"></script>
    <script>
      // Autentificarea GitHub rulează pe același domeniu (functions/api/auth.ts),
      // așa că adresa se completează automat — merge și pe domeniul de test *.pages.dev.
      CMS.init({ config: { backend: { base_url: window.location.origin } } });
    </script>
  </body>
</html>
