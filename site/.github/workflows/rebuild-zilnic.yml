# Reconstruiește site-ul în fiecare noapte, ca evenimentele care au trecut
# să se mute automat din „Urmează” în „Au avut loc” (site-ul e static).
#
# Configurare (o singură dată):
#   1. Cloudflare → Workers & Pages → proiectul → Settings → Builds → Deploy hooks
#      → „Add deploy hook” (branch: main) → copiază adresa.
#   2. GitHub → depozitul → Settings → Secrets and variables → Actions → New repository secret
#      Nume: CLOUDFLARE_DEPLOY_HOOK   Valoare: adresa de la pasul 1.
name: Rebuild zilnic

on:
  schedule:
    - cron: '5 22 * * *' # 22:05 UTC = 00:05 / 01:05 ora României
  workflow_dispatch: # buton manual „Run workflow” în tab-ul Actions

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Declanșează build pe Cloudflare Pages
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secretul CLOUDFLARE_DEPLOY_HOOK nu este setat (vezi comentariul din fișier)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
